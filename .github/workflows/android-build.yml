name: Hysera Android Build

on:
  push:
    paths-ignore:
      - "Release/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Hysera debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK Platform 36
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Hysera logo
        shell: bash
        run: |
          if [ -f Brand/hysera-logo.png ]; then
            mkdir -p Android/app/src/main/res/drawable-nodpi
            cp Brand/hysera-logo.png Android/app/src/main/res/drawable-nodpi/hysera_logo.png
            echo "Using Brand/hysera-logo.png"
          else
            echo "Brand/hysera-logo.png is absent; using the checked-in VectorDrawable fallback."
          fi

      - name: Grant Gradle wrapper permission
        run: chmod +x Android/gradlew

      - name: Build Hysera debug APK
        working-directory: Android
        run: ./gradlew --no-daemon assembleDebug

      - name: Stage Hysera debug APK
        shell: bash
        run: |
          mkdir -p Release
          cp Android/app/build/outputs/apk/debug/app-debug.apk Release/Hysera-debug.apk

      - name: Upload Hysera debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Hysera-debug-apk
          path: Release/Hysera-debug.apk
          if-no-files-found: error

      - name: Commit updated APK to Release
        if: github.actor != 'github-actions[bot]'
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- Release/Hysera-debug.apk)" ]; then
            echo "Release/Hysera-debug.apk is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Release/Hysera-debug.apk
          git commit -m "chore(release): update Hysera debug APK [skip ci]"
          git push
